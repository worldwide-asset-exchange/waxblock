# Shared TLS and access settings for both WaxBlock API server blocks.
# Install as /etc/nginx/waxblock/origin-common.conf.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:waxblock_tls:10m;

# Authenticated Origin Pulls: Cloudflare presents a client certificate on every request from the
# waxblock.io zone. "optional" lets the TLS handshake finish without one; locations.conf then refuses
# /api/ and /socket/ unless the certificate is valid. /api/v1/health stays reachable without it.
ssl_client_certificate /etc/nginx/waxblock/origin-pull-ca.pem;
ssl_verify_client optional;

# Only Cloudflare (and this host, for local checks) may connect. Restrict port 443 in your firewall
# as well where you can.
if ($from_cloudflare = 0) { return 403; }

client_max_body_size 64k;
