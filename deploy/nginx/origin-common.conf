# Shared TLS and access settings for both WaxBlock API server blocks.
# Install as /etc/nginx/waxblock/origin-common.conf.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:waxblock_tls:10m;

# Only Cloudflare (and this host, for local checks) may connect. Restrict port 443 in your firewall as
# well where you can. The API itself also checks the origin key that only our Cloudflare zone sends
# (ORIGIN_AUTH_KEY, see docs/install/reverse-proxy.md).
if ($from_cloudflare = 0) { return 403; }

client_max_body_size 64k;
