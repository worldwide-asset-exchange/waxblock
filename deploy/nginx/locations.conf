# WaxBlock API locations. Install as /etc/nginx/waxblock/locations.conf.
# Uses $waxblock_upstream, set in each server block.
# The proxy headers are repeated in every location on purpose: nginx inherits proxy_set_header from an
# outer level only when a location sets none of its own.

proxy_http_version 1.1;

# The API checks the X-WaxBlock-Origin-Auth header itself; nginx passes all request headers through.

location = /api/v1/health {
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
}

location /api/ {
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
}

location /socket/ {
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / { return 404; }
