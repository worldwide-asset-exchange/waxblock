# WaxBlock API locations. Install as /etc/nginx/waxblock/locations.conf.
# Uses $waxblock_upstream, set in each server block.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
proxy_set_header X-Forwarded-Proto https;

# Health is answered without the client certificate, so a monitor can always reach it.
location = /api/v1/health {
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Connection "";
}

location /api/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Connection "";
}

location /socket/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    proxy_pass http://$waxblock_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / { return 404; }
