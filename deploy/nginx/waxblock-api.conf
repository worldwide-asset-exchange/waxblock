# WaxBlock API — nginx reverse proxy for a bare-metal, VM or Docker host.
# Install as /etc/nginx/conf.d/waxblock-api.conf (or sites-enabled). See docs/install/reverse-proxy.md.
# Replace the two example hostnames and certificate paths with your own.
#
# Requires (generated, see deploy/nginx/update-cloudflare-ips.sh):
#   /etc/nginx/waxblock/cloudflare-geo.conf   the list of Cloudflare IP ranges
# Requires (download, see docs/install/reverse-proxy.md):
#   /etc/nginx/waxblock/origin-pull-ca.pem     the CA that signs the Authenticated Origin Pulls client certificate

# $from_cloudflare = 1 when the TCP peer is a Cloudflare address (or this host).
geo $from_cloudflare {
    default 0;
    127.0.0.1/32 1;   # local checks from this host
    ::1/128      1;
    include /etc/nginx/waxblock/cloudflare-geo.conf;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream waxblock_mainnet { server 127.0.0.1:8080; keepalive 16; }
upstream waxblock_testnet { server 127.0.0.1:8081; keepalive 16; }

# Port 80: ACME (Let's Encrypt) challenges only; everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name waxblock-api.example.org waxblock-testnet-api.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name waxblock-api.example.org;
    ssl_certificate     /etc/letsencrypt/live/waxblock-api.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waxblock-api.example.org/privkey.pem;
    include /etc/nginx/waxblock/origin-common.conf;
    set $waxblock_upstream waxblock_mainnet;
    include /etc/nginx/waxblock/locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name waxblock-testnet-api.example.org;
    ssl_certificate     /etc/letsencrypt/live/waxblock-testnet-api.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waxblock-testnet-api.example.org/privkey.pem;
    include /etc/nginx/waxblock/origin-common.conf;
    set $waxblock_upstream waxblock_testnet;
    include /etc/nginx/waxblock/locations.conf;
}
