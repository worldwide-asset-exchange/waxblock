# WaxBlock API — example Ingress for the AWS Load Balancer Controller (v2.7 or later) on EKS.
# See docs/install/aws.md#eks. Replace the hostnames and the two ARNs.
# The inbound-cidrs list is Cloudflare's list on 2026-11-06; refresh it from
# https://api.cloudflare.com/client/v4/ips when Cloudflare changes it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waxblock-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id-mainnet>,arn:aws:acm:<region>:<account>:certificate/<id-testnet>
    alb.ingress.kubernetes.io/inbound-cidrs: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/mutual-authentication: '[{"port":443,"mode":"verify","trustStore":"arn:aws:elasticloadbalancing:<region>:<account>:truststore/waxblock-cloudflare-aop/<id>"}]'
spec:
  ingressClassName: alb
  rules:
    - host: waxblock-api.example.org
      http:
        paths:
          - { path: /api/, pathType: Prefix, backend: { service: { name: waxblock-api-mainnet, port: { name: http } } } }
          - { path: /socket/, pathType: Prefix, backend: { service: { name: waxblock-api-mainnet, port: { name: http } } } }
    - host: waxblock-testnet-api.example.org
      http:
        paths:
          - { path: /api/, pathType: Prefix, backend: { service: { name: waxblock-api-testnet, port: { name: http } } } }
          - { path: /socket/, pathType: Prefix, backend: { service: { name: waxblock-api-testnet, port: { name: http } } } }
