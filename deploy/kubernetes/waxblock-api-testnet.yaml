# WaxBlock API — testnet on Kubernetes. See docs/install/kubernetes.md.
# Mainnet: waxblock-api-mainnet.yaml. Expose both through ingress.yaml or your own load balancer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: waxblock-api-testnet
data:
  # Replace the public endpoints with your own nodes where you can (docs/CONFIGURATION.md).
  NETWORK_TYPE: testnet
  PORT: "8080"
  BLOCKCHAIN_DEFAULT: https://testnet.waxsweden.org
  BLOCKCHAIN_STATE: https://testnet.waxsweden.org
  BLOCKCHAIN_BLOCK: https://testnet.waxsweden.org
  BLOCKCHAIN_TRANSACTION: https://testnet.waxsweden.org
  BLOCKCHAIN_HISTORY: https://testnet.waxsweden.org
  LIGHT_API: https://testnet-lightapi.eosams.xeos.me
  ATOMICASSETS: https://test.wax.api.atomicassets.io
  ASSETS_COUNT: "295873953"
  ASSETS_COUNT_TIMESTAMP: "1658903477000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waxblock-api-testnet
spec:
  replicas: 1 # one replica per provider is enough; see docs/DEPLOYMENT.md before scaling out
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: waxblock-api-testnet }
  template:
    metadata:
      labels: { app: waxblock-api-testnet }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          # Pin the digest from the release notes: ghcr.io/worldwide-asset-exchange/waxblock-api:<tag>@sha256:<digest>
          image: ghcr.io/worldwide-asset-exchange/waxblock-api:v1.3.1
          envFrom:
            - configMapRef: { name: waxblock-api-testnet }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/v1/test, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/v1/test, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          volumeMounts:
            - { name: cache, mountPath: /app/apps/api/cache }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 1Gi } # rebuilt in ~3 min after a restart; use a PVC to keep it warm
---
apiVersion: v1
kind: Service
metadata:
  name: waxblock-api-testnet
spec:
  selector: { app: waxblock-api-testnet }
  ports:
    - { name: http, port: 80, targetPort: http }
