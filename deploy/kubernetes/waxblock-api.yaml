# WaxBlock API — Kubernetes example (one network). Copy and set NETWORK_TYPE / endpoints for testnet.
# Expose the Service through your own Ingress or load balancer with TLS and WebSocket support.
apiVersion: v1
kind: ConfigMap
metadata:
  name: waxblock-api-mainnet
data:
  NETWORK_TYPE: mainnet
  PORT: "8080"
  BLOCKCHAIN_DEFAULT: https://wax.eosusa.io
  BLOCKCHAIN_STATE: https://wax.eosusa.io
  BLOCKCHAIN_BLOCK: https://wax.eosusa.io
  BLOCKCHAIN_TRANSACTION: https://wax.eosusa.io
  BLOCKCHAIN_HISTORY: https://wax.eosusa.io
  LIGHT_API: https://wax.light-api.net
  ATOMICASSETS: https://wax.api.atomicassets.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waxblock-api-mainnet
spec:
  replicas: 1 # one replica per provider is enough; see docs/DEPLOYMENT.md before scaling out
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: waxblock-api-mainnet }
  template:
    metadata:
      labels: { app: waxblock-api-mainnet }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/worldwide-asset-exchange/waxblock-api:v1.3.0
          envFrom:
            - configMapRef: { name: waxblock-api-mainnet }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/v1/test, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/v1/test, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          volumeMounts:
            - { name: cache, mountPath: /app/apps/api/cache }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: waxblock-api-mainnet
spec:
  selector: { app: waxblock-api-mainnet }
  ports:
    - { name: http, port: 80, targetPort: http }
