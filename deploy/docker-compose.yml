# WaxBlock API — production example for infrastructure providers.
# Runs mainnet and testnet side by side. Put a TLS-terminating reverse proxy (or your load balancer) in
# front of ports 8080/8081; see docs/DEPLOYMENT.md.
#
#   WAXBLOCK_VERSION=v1.3.1@sha256:<digest from the release notes> docker compose up -d
# or put that line in a .env file next to this file. See docs/install/docker.md.
#
services:
  waxblock-api-mainnet:
    image: ghcr.io/worldwide-asset-exchange/waxblock-api:${WAXBLOCK_VERSION:?set WAXBLOCK_VERSION, e.g. v1.3.1@sha256:<digest>}
    env_file: env/mainnet.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mainnet-cache:/app/apps/api/cache
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  waxblock-api-testnet:
    image: ghcr.io/worldwide-asset-exchange/waxblock-api:${WAXBLOCK_VERSION:?set WAXBLOCK_VERSION, e.g. v1.3.1@sha256:<digest>}
    env_file: env/testnet.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - testnet-cache:/app/apps/api/cache
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  mainnet-cache:
  testnet-cache:
